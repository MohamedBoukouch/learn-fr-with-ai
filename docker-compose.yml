version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: eformation-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot Application
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: eformation-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USERNAME: appuser
      DB_PASSWORD: apppass
      JWT_SECRET: your-super-secret-jwt-key-for-local-dev-only
      GEMINI_API_KEY: your-gemini-api-key
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost,http://localhost:80
      SERVER_PORT: 8080
    volumes:
      - ./BackEnd/uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend React Application (Production - Nginx)
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: eformation-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: